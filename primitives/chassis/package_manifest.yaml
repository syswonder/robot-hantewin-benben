# Hantewin BenBen chassis primitive — TBox-SDK-based driver.
#
# One device = one package. This driver owns the robot's base/chassis:
#   robonix/primitive/chassis/move      → gRPC ExecuteMoveCommand(MoveCommand) → String
#   robonix/primitive/chassis/odom      → ROS2 topic_out (nav_msgs/Odometry, /odom)
#   robonix/primitive/chassis/twist_in  → ROS2 topic_in (geometry_msgs/Twist, /cmd_vel)
#   robonix/primitive/chassis/driver    → gRPC LifecycleDriver.Driver(INIT/PROBE/...)
#
# `*/driver` is the lifecycle interface every primitive should declare —
# `rbnx boot` calls Driver(CMD_INIT) after RegisterCapability, waits for
# ok=true, only then proceeds to next package.
#
# The driver runs on the host directly (no Docker). It initializes the
# TBox C++ SDK for chassis control and bridges the controller's ROS1 /odom
# stream into ROS2.
manifestVersion: 1

package:
  name: robonix.primitive.hantewin.benben.chassis
  version: 0.1.0
  description: Hantewin BenBen chassis driver — velocity control via TBox SDK + ROS1-to-ROS2 odometry bridge.
  tags: [primitive, chassis, tbox, benben]
  maintainers: [wheatfox <wheatfox17@icloud.com>]
  license: MulanPSL-2.0

build: bash scripts/build.sh
start: bash scripts/start.sh

capabilities:
  - name: robonix/primitive/chassis/move
  - name: robonix/primitive/chassis/odom
  - name: robonix/primitive/chassis/twist_in
  - name: robonix/primitive/chassis/driver
