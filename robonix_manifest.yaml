manifestVersion: 1
name: robonix-hty
# set -a; source ~/.robonix/secrets.env; set +a

catalog:
  name: robonix.robot.hantewin.benben
  version: 0.2.0
  description: "Robonix deploy manifest for the Hantewin Benben"
  tags: [robot, deploy, hantewin, benben, jetson, lidar, rgbd, scene, mapping]
  license: Apache-2.0
  maintainers:
    - futaba19-c <futaba19c@foxmail.com>

env:
  LOG: "INFO"
  ROS_DOMAIN_ID: "0"
  # RMW_IMPLEMENTATION: rmw_fastrtps_cpp # rmw_zenoh_cpp 
  SCENE_NATIVE_PYTHON: /home/hty/pyenv/env/bin/python3
  # hf-mirror.com 302/308-redirects Xet-backed files (like this CLIP
  # checkpoint) cross-domain back to huggingface.co; huggingface_hub only
  # follows same-domain redirects when fetching HEAD metadata, so the mirror
  # fails with a misleading "check your firewall" error. Direct access works.
  HF_ENDPOINT: https://huggingface.co
  PIP_USER: "0"
  RBNX_BUILD_TARGET: jetson-native
  ROBONIX_SCENE_FORCE: native
  ROBONIX_SCENE_PLATFORM: jetson_thor
  ROBONIX_SCENE_ROS_DISTRO: jazzy
  # SCENE_NATIVE_PYTHON: python3
  SCENE_WEB_PORT: "50107"
  ROBONIX_MAPPING_FORCE: native
  ROBONIX_MAPPING_PLATFORM: jetson_thor
  MAPPING_WEBUI_PORT: "8091"
  # Exposes unauthenticated map save/load/pose-estimate operations on the
  # network -- only enable on a trusted LAN.
  MAPPING_WEBUI_HOST: "0.0.0.0"
  ROBONIX_NAV2_FORCE: native
  ROBONIX_NAV2_PLATFORM: jetson_thor
  SCENE_MAP_ID: outsides
  SCENE_RESTORE_ON_START: "true"
  MAPPING_MAPS_DIR: ${HOME}/.robonix/maps
  SCENE_GRAPH_ENABLED: "false"
  SCENE_GRAPH_CAPTION_ENABLED: "false"
  SCENE_GRAPH_RELATION_ENABLED: "false"
  SCENE_GRAPH_IMAGE_RELATIONS: "false"
  # load_map verify: rtabmap regenerates the grid slightly differently on DB
  # reload (boundary/unknown cells), so the stock 0.999/0.995 thresholds reject
  # every legit load (v2_27f measured agreement=0.991 occ=0.971 free=0.967).
  # Relaxed so a correctly-loaded map passes while a genuinely wrong map still
  # fails (map_ops.py env overrides MAPPING_LOAD_MIN_CELL_AGREEMENT/_MIN_CLASS_IOU).
  MAPPING_LOAD_MIN_CELL_AGREEMENT: "0.95"
  MAPPING_LOAD_MIN_CLASS_IOU: "0.90"
  SCENE_OBJECT_MEMORY_DB: ${HOME}/.robonix/scene/objects.db
  SCENE_GRAPH_CACHE_DIR: ${HOME}/.robonix/scene/graph
  SCENE_ANNOTATIONS_DIR: ${HOME}/.robonix/scene/annotations
  SPEECH_BACKEND: tencent
  ROS_DISTRO: jazzy

system:
  atlas:
    listen: 0.0.0.0:50051
    log: info
  executor:
    listen: 0.0.0.0:50061
    log: info
  pilot:
    listen: 0.0.0.0:50071
    log: info
    vlm:
      upstream: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}
      api_format: openai
  soma:
    robot_yaml: ./soma.yaml
    listen: 0.0.0.0:50091
    log: info
  liaison:
    listen: 0.0.0.0:50081
    log: info
  scene:
    log: info
    manifest: package_manifest.jetson-native.yaml
    # camera_provider_id: realsense_camera
    web_port: 50107 
primitive: 
  - name: mid360_lidar
    path: ./primitives/primitive-livox-mid360-lidar-rbnx
    config:
      lidar_ip: 192.168.1.133
      host_ip: 192.168.1.50             
      publish_freq: 10.0
      frame_id: livox_frame
      parent_frame: base_link
      extrinsics:
        x: 0.0
        y: 0.0
        z: 1.0
        roll: 0.0
        pitch: 0.0
        # ros2 tf2_ros static_transform_publisher's --yaw takes radians, not
        # degrees (see mid360_driver/main.py _spawn_stp). 90 deg = pi/2 rad.
        yaw: 1.5707963267948966


  - name: audio_client_bridge
    url: https://github.com/syswonder/primitive-audio-client-bridge-rbnx
    branch: main
    config:
      transport: reverse
      listen_host: 0.0.0.0
      listen_port: 60002
  - name: audio_driver
    url: https://github.com/syswonder/primitive-audio-driver-rbnx
    branch: main
    config:
      mic_device: plughw:CARD=Plus,DEV=0
      mic_sample_rate: 16000
      speaker_device: plughw:CARD=Plus,DEV=0
      speaker_sample_rate: 16000

