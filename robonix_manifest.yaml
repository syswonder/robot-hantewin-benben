service: 
  - name: mapping
    path: ./services/service-map-rbnx
    manifest: package_manifest.jetson-native.yaml
    config:
      map_id: outside
      sensor_providers:
        lidar3d: mid360_lidar
        # lidar2d: lakibeam1_lidar
        imu: mid360_imu
        # imu: chassis_imu
        odom: benben_chassis
        # rgb: realsense_camera
        # depth: realsense_camera
      algo: rtabmap
      map_mode: localization  # localization
      deskew_lidar: true # 2d雷达则不需要去畸变
      params_file: config/rtabmap_params.yaml
      lidar_frame: laser                    # 改用 2D 雷达（lakibeam1）进行定位
      lidar_base_extrinsic:
        x: 0.0
        y: 0.0
        z: 0.0                               # 2D 雷达在底部，z=0
        roll: 0.0
        pitch: 0.0
        yaw: 0.0   #1.5707963267948966
      rtabmap_params: 
        Grid/FootprintLength: 0.84
        Grid/FootprintWidth: 0.60

  - name: nav2
    path: ./services/service-navigation-rbnx
    manifest: package_manifest.jetson-native.yaml
    config:
      params_file: config/nav2_params.yaml
      bt_xml_file: config/navigate.xml
      scan_projection:
        enabled: true
        min_height_m: 0.30
        max_height_m: 1.40
        range_max_m: 12.0
        self_filter_margin_m: 0.05
      action_wait_s: 80.0
      # Terminal-alignment patience (config.spec: guard_* keys feed
      # ROBONIX_GUARD_* env vars in atlas_bridge._spawn_velocity_guard).
      # The chassis only realises ~0.12 rad/s effective rotation from the
      # ~0.15 rad/s terminal commands (skid-steer slip, verified 2026-09-02),
      # so closing the last ~0.8 rad of yaw error takes 6-7 s. The default
      # 3 s no-progress window cancelled goals that were still converging.
      guard_no_progress_s: 8.0
      guard_terminal_timeout_s: 25.0
      provider_ids:
        map: mapping
        # Canonical odom owner. Replace with a declared Mid360 LIO provider
        # only after that provider exists and passes the static-drift gate.
        odom: benben_chassis
        scan_cloud: mid360_lidar # lakibeam1_lidar mid360_lidar
        imu: mid360_imu
        
  - name: speech
    path: ${ROBONIX_SOURCE_PATH}/services/speech
    config:
      speech_backend: tencent
      default_speaker_provider_id: audio_driver
      tencent_asr_appid: ${TENCENT_ASR_APPID}
      tencent_tts_voice_type: 502003     

