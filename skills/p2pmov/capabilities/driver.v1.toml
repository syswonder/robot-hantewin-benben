# Lifecycle interface for the p2pmov skill.
# `rbnx boot` calls Driver(CMD_INIT, config_json) AFTER the skill process
# has registered with atlas. on_init validates the config; CMD_ACTIVATE is
# sent by the executor on the first LLM call, which is when we initialize
# the TBox SDK (heavy: TCP + auth handshake). Without this contract the
# handlers never fire and every MCP call returns "controller not initialized".
[contract]
id      = "robonix/skill/p2pmov/driver"
version = "1"
kind    = "skill"
idl     = "lifecycle/srv/Driver.srv"

[mode]
type = "rpc"
